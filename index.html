<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Cuti BPP</title>

  <link rel="stylesheet"
  href="style.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

  <div class="logo">
    CUTI BPP
  </div>

  <div class="menu">

    <a href="#bengkel">
      Bengkel
    </a>

    <a href="#transport">
      Transport
    </a>

    <a href="#ajukan">
      Ajukan Cuti
    </a>

  </div>

</nav>

<!-- HERO -->

<section class="hero">

  <div class="hero-content">

    <h1>
      CUTI BPP
    </h1>

    <p>
      Bengkel Teknik Dan Transport
    </p>

    <a href="#bengkel"
    class="btn">
      LIHAT DATA CUTI
    </a>

  </div>

</section>

<!-- BENGKEL -->

<section id="bengkel"
class="section">

  <div class="container">

    <div class="box">

      <h2>
        Data Bengkel Sedang Cuti
      </h2>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>Nama</th>
              <th>Jabatan</th>
              <th>Cuti Dari</th>
              <th>Cuti Sampai</th>
            </tr>

          </thead>

          <tbody id="bengkelAktif">

          </tbody>

        </table>

      </div>

    </div>

  </div>

</section>

<!-- TRANSPORT -->

<section id="transport"
class="section">

  <div class="container">

    <div class="box">

      <h2>
        Data Transport Sedang Cuti
      </h2>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>Nama</th>
              <th>Jabatan</th>
              <th>Cuti Dari</th>
              <th>Cuti Sampai</th>
            </tr>

          </thead>

          <tbody id="transportAktif">

          </tbody>

        </table>

      </div>

    </div>

  </div>

</section>

<!-- SEMUA CUTI -->

<section class="section">

  <div class="container">

    <div class="box">

      <h2>
        Semua Riwayat Cuti
      </h2>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>Nama</th>
              <th>Jabatan</th>
              <th>Keterangan</th>
              <th>Alamat Cuti</th>
            </tr>

          </thead>

          <tbody id="semuaCuti">

          </tbody>

        </table>

      </div>

    </div>

  </div>

</section>

<!-- FORM -->

<section id="ajukan"
class="section">

  <div class="container">

    <div class="form-box">

      <h2>
        Ajukan Cuti
      </h2>

      <form id="cutiForm">

        <input
        type="text"
        id="nama"
        placeholder="Nama"
        required>

        <input
        type="date"
        id="dari"
        required>

        <input
        type="date"
        id="sampai"
        required>

        <textarea
        id="keperluan"
        placeholder="Keperluan"
        required></textarea>

        <button type="submit">
          Kirim Pengajuan
        </button>

      </form>

    </div>

  </div>

</section>

<script src="script.js"></script>

</body>
</html>
