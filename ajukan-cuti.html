<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Ajukan Cuti</title>

  <link rel="stylesheet"
  href="style.css">

</head>

<body>

<nav class="navbar">

  <div class="logo">
    CUTI BPP
  </div>

  <div class="menu">

    <a href="index.html">
      Home
    </a>

    <a href="bengkel.html">
      Bengkel
    </a>

    <a href="transport.html">
      Transport

  </div>

</nav>

<section class="section">

  <div class="container">

    <div class="form-box">

      <h2>
        Ajukan Cuti
      </h2>

      <form id="cutiForm">

        <input
        type="text"
        id="nama"
        placeholder="Nama"
        required>

        <input
        type="date"
        id="dari"
        required>

        <input
        type="date"
        id="sampai"
        required>

        <textarea
        id="keperluan"
        placeholder="Keperluan"
        required></textarea>

        <button type="submit">
          Kirim Pengajuan
        </button>

      </form>

    </div>

  </div>

</section>

<script src="ajukan.js"></script>

</body>
</html>
